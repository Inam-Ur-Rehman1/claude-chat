<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-v9gUvROPW5C6vbityyyR7xgYX6axjviCgmzYYYPAKGA='; style-src 'unsafe-inline'; img-src data:; connect-src https://api.anthropic.com; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<title>Chat</title>
<style>
  :root {
    --bg: #f7f5f0; --panel: #ffffff; --text: #1f1e1b; --muted: #77746c;
    --line: #e4e0d6; --accent: #c96442; --accent-text: #fff;
    --user-bg: #ece8de; --code-bg: #f1eee6; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19; --panel: #262522; --text: #ece9e1; --muted: #9b978d;
      --line: #3a3833; --accent: #d97757; --user-bg: #33312c; --code-bg: #2f2d29;
      --danger: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header .actions { display: flex; gap: 8px; align-items: center; }
  button, select {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); padding: 6px 12px; font-size: 14px;
  }
  button:hover, select:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }

  main { flex: 1; overflow-y: auto; min-height: 0; }
  #messages { max-width: 760px; margin: 0 auto; padding: 24px 20px 12px; }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty h2 { color: var(--text); font-weight: 500; font-size: 26px; margin: 0 0 6px; }

  .msg { margin: 0 0 22px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--user-bg); padding: 10px 14px; border-radius: 16px;
    max-width: 85%; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.assistant .bubble { word-wrap: break-word; }
  .bubble p { margin: 0 0 12px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 12px; padding-left: 24px; }
  .bubble h3, .bubble h4 { margin: 16px 0 8px; }
  .bubble a { color: var(--accent); }
  .bubble code {
    background: var(--code-bg); padding: 1px 5px; border-radius: 5px;
    font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .bubble pre {
    background: var(--code-bg); padding: 12px 14px; border-radius: 10px;
    overflow-x: auto; position: relative; margin: 0 0 12px;
  }
  .bubble pre code { background: none; padding: 0; }
  .copy-btn { position: absolute; top: 6px; right: 6px; font-size: 12px; padding: 2px 8px; }
  .error { color: var(--danger); font-size: 14px; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }

  footer { padding: 10px 20px 18px; padding-bottom: max(18px, env(safe-area-inset-bottom)); }
  form#composer {
    max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 8px 8px 8px 14px;
  }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; max-height: 200px; padding: 6px 0;
  }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }

  #gate {
    position: fixed; inset: 0; background: var(--bg); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  #gate form {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px;
  }
  #gate h2 { margin: 0; font-size: 20px; font-weight: 600; }
  #gate p { margin: 0; font-size: 14px; color: var(--muted); }
  #gate input {
    font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text);
  }
  .status { font-size: 14px; color: var(--muted); min-height: 1.4em; }
  .status.error { color: var(--danger); }
  .linkbtn {
    background: none; border: 0; padding: 2px; color: var(--muted);
    font-size: 13px; text-decoration: underline; align-self: center;
  }
  .linkbtn.armed { color: var(--danger); }
  [hidden] { display: none !important; }
  @media (max-width: 520px) {
    header { padding: 10px 12px; }
    header h1 { display: none; }
    button, select { padding: 6px 9px; }
  }
</style>
</head>
<body>

<div id="gate">
  <form id="gateForm" novalidate>
    <h2 id="gateTitle">Locked</h2>
    <p id="gateText">Enter your passcode to unlock.</p>
    <input id="keyInput" type="password" autocomplete="off" spellcheck="false" placeholder="Anthropic API key (sk-ant-...)" aria-label="Anthropic API key" hidden>
    <input id="passInput" type="password" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode">
    <input id="pass2Input" type="password" autocomplete="new-password" placeholder="Type the passcode again" aria-label="Repeat passcode" hidden>
    <div id="gateMsg" class="status" role="status" aria-live="polite"></div>
    <button class="primary" id="gateBtn" type="submit">Unlock</button>
    <button class="linkbtn" id="resetBtn" type="button" hidden>Forgot passcode? Erase and start over</button>
    <noscript><p>This page needs JavaScript turned on.</p></noscript>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1>Chat</h1>
    <div class="actions">
      <select id="model" title="Model">
        <option value="claude-sonnet-5-5">Sonnet 5.5</option>
        <option value="claude-opus-5-5">Opus 5.5</option>
        <option value="claude-haiku-5-5">Haiku 5.5</option>
      </select>
      <button id="newChat" type="button">New chat</button>
      <button id="lockBtn" type="button" title="Lock the chat. Your passcode is needed to open it again.">Lock</button>
    </div>
  </header>

  <main id="scroller">
    <div id="messages"></div>
  </main>

  <footer>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message Claude…" aria-label="Message"></textarea>
      <button id="send" class="primary" type="submit">Send</button>
    </form>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </footer>
</div>

<script>
"use strict";
/* Refuse to run inside another site's frame */
if (window.top !== window.self) {
  document.body.textContent = "This page can't be shown inside another site.";
  throw new Error("Refusing to run inside a frame");
}

/* ---------- Settings ---------- */
const API_URL = "https://api.anthropic.com/v1/messages";
const MODELS_URL = "https://api.anthropic.com/v1/models?limit=1";
const SYSTEM_PROMPT = "You are Claude, a helpful AI assistant.";
const MAX_TOKENS = 8192;
const AUTO_LOCK_MINUTES = 30;      // lock after this long without activity
const MIN_PASSCODE = 6;
const PBKDF2_ITERATIONS = 600000;  // makes passcode guessing slow
const VAULT = "vault_v1";          // encrypted API key
const HISTORY = "history_v1";      // encrypted chat history
const LEGACY_KEY = "anthropic_key", LEGACY_HISTORY = "chat_history"; // old plain-text storage

/* ---------- Storage (safe wrappers) ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

/* ---------- Encryption: PBKDF2 (SHA-256) -> AES-256-GCM ---------- */
const te = new TextEncoder(), td = new TextDecoder();
function toB64(buf) {
  const u = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(str) {
  const s = atob(str), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}
async function deriveKey(passcode, salt, iterations) {
  const base = await crypto.subtle.importKey("raw", te.encode(passcode), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(key, text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(text));
  return { iv: toB64(iv), ct: toB64(ct) };
}
async function unseal(key, box) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(box.iv) }, key, fromB64(box.ct));
  return td.decode(pt);
}

/* ---------- State ---------- */
let cryptoKey = null;   // only in memory while unlocked
let apiKey = "";
let history = [];
let busy = false;
let session = 0;        // bumps on every lock, so late replies are ignored
let currentAbort = null;
let lastActive = Date.now();

const $ = (id) => document.getElementById(id);
const gate = $("gate"), app = $("app");
const keyInput = $("keyInput"), passInput = $("passInput"), pass2Input = $("pass2Input");
const gateMsg = $("gateMsg"), gateBtn = $("gateBtn"), resetBtn = $("resetBtn");
const messagesEl = $("messages"), inputEl = $("input"), sendBtn = $("send"), scroller = $("scroller");
const modelEl = $("model");
modelEl.value = store.get("chat_model") || "claude-sonnet-5-5";
if (!modelEl.value) modelEl.value = "claude-sonnet-5-5";
modelEl.addEventListener("change", () => store.set("chat_model", modelEl.value));

function headersFor(key) {
  return {
    "content-type": "application/json",
    "x-api-key": key,
    "anthropic-version": "2023-06-01",
    "anthropic-dangerous-direct-browser-access": "true",
  };
}

/* ---------- Minimal, safe Markdown ---------- */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function renderMarkdown(src) {
  const out = [];
  const parts = src.split(/```/);
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const nl = part.indexOf("\n");
      const code = nl === -1 ? part : part.slice(nl + 1);
      out.push('<pre><button class="copy-btn" type="button">Copy</button><code>' + esc(code.replace(/\n$/, "")) + "</code></pre>");
      return;
    }
    for (const block of part.split(/\n{2,}/)) {
      const b = block.trim();
      if (!b) continue;
      const lines = b.split("\n");
      if (lines.every((l) => /^\s*[-*•]\s+/.test(l))) {
        out.push("<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*[-*•]\s+/, "")) + "</li>").join("") + "</ul>");
      } else if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l))) {
        out.push("<ol>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>");
      } else if (/^#{1,6}\s/.test(b) && lines.length === 1) {
        const level = b.match(/^#+/)[0].length <= 2 ? "h3" : "h4";
        out.push(`<${level}>` + inline(b.replace(/^#+\s*/, "")) + `</${level}>`);
      } else {
        out.push("<p>" + lines.map(inline).join("<br>") + "</p>");
      }
    }
  });
  return out.join("");
}

/* ---------- Rendering ---------- */
function renderAll() {
  messagesEl.innerHTML = "";
  if (!history.length) {
    messagesEl.innerHTML = '<div class="empty"><h2>How can I help you today?</h2><div>Ask anything to get started.</div></div>';
    return;
  }
  for (const m of history) addMessage(m.role, m.content);
  scrollDown();
}
function addMessage(role, content) {
  const empty = messagesEl.querySelector(".empty");
  if (empty) empty.remove();
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (role === "user") bubble.textContent = content;
  else bubble.innerHTML = renderMarkdown(content);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  return bubble;
}
function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }

/* Saves are encrypted and run one after another, so an older save can't overwrite a newer one */
let saving = Promise.resolve();
function save() {
  if (!cryptoKey) return saving;
  const key = cryptoKey, snapshot = JSON.stringify(history.slice(-100));
  saving = saving
    .then(async () => { store.set(HISTORY, JSON.stringify(await seal(key, snapshot))); })
    .catch(() => {});
  return saving;
}

messagesEl.addEventListener("click", (e) => {
  if (!e.target.classList.contains("copy-btn")) return;
  const code = e.target.nextElementSibling.textContent;
  navigator.clipboard?.writeText(code).then(() => {
    e.target.textContent = "Copied";
    setTimeout(() => (e.target.textContent = "Copy"), 1200);
  });
});

function apiErrorMessage(status, text) {
  let msg = "";
  try { msg = JSON.parse(text).error?.message || ""; } catch {}
  if (status === 401) return "Anthropic rejected your API key. Click Lock, choose “Forgot passcode? Erase and start over”, and enter a new key.";
  if (status === 429) return msg || "Rate limit reached. Wait a moment and try again.";
  if (status === 529) return "Claude is overloaded right now. Try again in a moment.";
  return msg || text || ("Request failed (" + status + ")");
}

/* ---------- Lock screen: set up, unlock, lock, reset ---------- */
let gateMode = "unlock";
function readVault() {
  try {
    const v = JSON.parse(store.get(VAULT) || "null");
    return v && v.salt && v.iv && v.ct ? v : null;
  } catch { return null; }
}
function setMsg(text, isError) {
  gateMsg.textContent = text || "";
  gateMsg.classList.toggle("error", !!isError);
}
function showGate(mode, msg, isError) {
  gateMode = mode;
  const setup = mode === "setup";
  app.hidden = true;
  gate.hidden = false;
  $("gateTitle").textContent = setup ? "Set up your private chat" : "Locked";
  $("gateText").textContent = setup
    ? "Paste your Anthropic API key and choose a passcode. Your key and chats are stored encrypted in this browser, and only your passcode can unlock them."
    : "Enter your passcode to unlock.";
  keyInput.hidden = !setup;
  pass2Input.hidden = !setup;
  resetBtn.hidden = setup;
  passInput.autocomplete = setup ? "new-password" : "current-password";
  passInput.placeholder = setup ? "Choose a passcode (" + MIN_PASSCODE + "+ characters)" : "Passcode";
  gateBtn.textContent = setup ? "Save and start" : "Unlock";
  gateBtn.disabled = false;
  passInput.value = "";
  pass2Input.value = "";
  disarmReset();
  setMsg(msg, isError);
  setTimeout(() => (setup && !keyInput.value ? keyInput : passInput).focus(), 0);
}

$("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (gateBtn.disabled) return;
  if (!window.crypto || !crypto.subtle) {
    setMsg("This browser can't encrypt here. Open the page over https in an up-to-date browser.", true);
    return;
  }
  gateBtn.disabled = true;
  try {
    if (gateMode === "setup") await doSetup();
    else await doUnlock();
  } catch (err) {
    setMsg("Something went wrong: " + (err && err.message ? err.message : err), true);
  } finally {
    gateBtn.disabled = false;
  }
});

async function doSetup() {
  const key = keyInput.value.trim(), p1 = passInput.value, p2 = pass2Input.value;
  if (!key.startsWith("sk-ant-")) return setMsg("That doesn't look like an Anthropic key (it should start with sk-ant-).", true);
  if (p1.length < MIN_PASSCODE) return setMsg("Use at least " + MIN_PASSCODE + " characters for your passcode.", true);
  if (p1 !== p2) return setMsg("The two passcodes don't match.", true);

  setMsg("Checking your key…");
  try {
    const res = await fetch(MODELS_URL, { headers: headersFor(key) });
    if (res.status === 401 || res.status === 403) return setMsg("That key was rejected by Anthropic.", true);
  } catch {
    // Network hiccup: accept the key anyway; errors will show when chatting.
  }

  setMsg("Encrypting…");
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const k = await deriveKey(p1, salt, PBKDF2_ITERATIONS);
  const box = await seal(k, key);
  store.set(VAULT, JSON.stringify({ v: 1, iter: PBKDF2_ITERATIONS, salt: toB64(salt), iv: box.iv, ct: box.ct }));
  if (!readVault()) return setMsg("This browser won't save data (private window or storage turned off).", true);

  // Bring over chats saved by the old, unencrypted version, then delete the plain-text copies.
  let carried = [];
  try { const h = JSON.parse(store.get(LEGACY_HISTORY) || "[]"); if (Array.isArray(h)) carried = h; } catch {}
  store.del(LEGACY_KEY);
  store.del(LEGACY_HISTORY);
  store.del(HISTORY);

  cryptoKey = k;
  apiKey = key;
  history = carried;
  await save();
  unlocked();
}

async function doUnlock() {
  const vault = readVault();
  if (!vault) return showGate("setup");
  const p = passInput.value;
  if (!p) return setMsg("Enter your passcode.", true);

  setMsg("Unlocking…");
  let k, key;
  try {
    k = await deriveKey(p, fromB64(vault.salt), vault.iter || PBKDF2_ITERATIONS);
    key = await unseal(k, vault);
  } catch {
    passInput.value = "";
    await new Promise((r) => setTimeout(r, 700));
    return setMsg("Wrong passcode.", true);
  }

  cryptoKey = k;
  apiKey = key;
  history = [];
  const raw = store.get(HISTORY);
  if (raw) {
    try { const h = JSON.parse(await unseal(k, JSON.parse(raw))); if (Array.isArray(h)) history = h; } catch {}
  }
  unlocked();
}

function unlocked() {
  keyInput.value = passInput.value = pass2Input.value = "";
  setMsg("");
  gate.hidden = true;
  app.hidden = false;
  lastActive = Date.now();
  renderAll();
  inputEl.focus();
}

function lock(msg) {
  session++;
  if (currentAbort) currentAbort.abort();
  currentAbort = null;
  busy = false;
  sendBtn.disabled = false;
  cryptoKey = null;
  apiKey = "";
  history = [];
  messagesEl.innerHTML = "";
  inputEl.value = "";
  inputEl.style.height = "auto";
  showGate(readVault() ? "unlock" : "setup", msg);
}
$("lockBtn").addEventListener("click", () => lock());

let resetTimer = null;
function disarmReset() {
  clearTimeout(resetTimer);
  delete resetBtn.dataset.armed;
  resetBtn.classList.remove("armed");
  resetBtn.textContent = "Forgot passcode? Erase and start over";
}
resetBtn.addEventListener("click", () => {
  // Inline two-click confirm (avoids blocking browser dialogs)
  if (!resetBtn.dataset.armed) {
    resetBtn.dataset.armed = "1";
    resetBtn.classList.add("armed");
    resetBtn.textContent = "Click again to erase the saved key and chats";
    resetTimer = setTimeout(disarmReset, 4000);
    return;
  }
  [VAULT, HISTORY, LEGACY_KEY, LEGACY_HISTORY].forEach((k) => store.del(k));
  keyInput.value = "";
  showGate("setup", "Erased. Set up again with your API key and a new passcode.");
});

/* Auto-lock after inactivity, and whenever you leave the page */
function markActive() { lastActive = Date.now(); }
["pointerdown", "keydown", "wheel", "touchstart", "scroll"].forEach((ev) =>
  document.addEventListener(ev, markActive, { capture: true, passive: true }));
function checkIdle() {
  if (cryptoKey && !busy && Date.now() - lastActive > AUTO_LOCK_MINUTES * 60000) {
    lock("Locked after " + AUTO_LOCK_MINUTES + " minutes without activity.");
  }
}
setInterval(checkIdle, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkIdle(); });
window.addEventListener("pagehide", () => { if (cryptoKey) lock(); });

$("newChat").addEventListener("click", () => {
  if (busy || !cryptoKey) return;
  history = [];
  save();
  renderAll();
  inputEl.focus();
});

/* ---------- Sending + streaming ---------- */
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
});
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});

function conversationForApi() {
  const msgs = history.slice(-40).map((m) => ({ role: m.role, content: m.content }));
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  return msgs;
}

$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || busy || !cryptoKey) return;
  const mySession = session;
  busy = true;
  sendBtn.disabled = true;
  inputEl.value = "";
  inputEl.style.height = "auto";

  history.push({ role: "user", content: text });
  save();
  addMessage("user", text);
  const bubble = addMessage("assistant", "");
  bubble.classList.add("cursor");
  scrollDown();

  const abort = new AbortController();
  currentAbort = abort;
  let reply = "";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: headersFor(apiKey),
      signal: abort.signal,
      body: JSON.stringify({
        model: modelEl.value,
        max_tokens: MAX_TOKENS,
        system: SYSTEM_PROMPT,
        messages: conversationForApi(),
        stream: true,
      }),
    });
    if (!res.ok || !res.body) {
      const errText = await res.text().catch(() => "");
      throw new Error(apiErrorMessage(res.status, errText));
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (!data) continue;
        let evt;
        try { evt = JSON.parse(data); } catch { continue; }
        if (evt.type === "content_block_delta" && evt.delta?.type === "text_delta") {
          reply += evt.delta.text;
          bubble.innerHTML = renderMarkdown(reply);
          scrollDown();
        } else if (evt.type === "error") {
          throw new Error(evt.error?.message || "Stream error");
        }
      }
    }
    if (mySession !== session) return;
    if (!reply) throw new Error("Empty response from Claude.");
    history.push({ role: "assistant", content: reply });
    save();
  } catch (err) {
    if (mySession !== session) return; // locked while waiting: drop everything quietly
    const msg = err instanceof TypeError ? "Network error. Check your connection and try again." : String(err.message || err);
    if (reply) {
      history.push({ role: "assistant", content: reply });
    } else {
      history.pop(); // drop the unanswered turn so the conversation stays valid
      inputEl.value = text;
    }
    save();
    bubble.insertAdjacentHTML("beforeend", '<div class="error">Error: ' + esc(msg) + "</div>");
  } finally {
    if (mySession === session) {
      bubble.classList.remove("cursor");
      busy = false;
      sendBtn.disabled = false;
      currentAbort = null;
      lastActive = Date.now();
      inputEl.focus();
    }
  }
});

/* ---------- Start ---------- */
if (readVault()) {
  showGate("unlock");
} else {
  const legacy = store.get(LEGACY_KEY);
  if (legacy) keyInput.value = legacy;
  showGate("setup", legacy ? "Choose a passcode to protect the key this browser already saved." : "");
}
</script>
